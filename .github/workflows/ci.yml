name: CI

# Runs on every pull request and push to main. Uses no secrets and never
# touches the live Firebase project: rules and admin-script tests run against
# the local emulators under a demo- project id.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  firestore:
    name: Rules + admin script tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: tests
      - run: npm ci
        working-directory: functions
      - name: Run tests in the Firestore emulator
        run: >
          npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-mynotes
          "npm --prefix tests test && npm --prefix functions test"
